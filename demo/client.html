<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETTING widget demo — client</title>
    <style>body{font-family:system-ui,sans-serif;padding:40px;background:#f6f7f9}nav a{margin-right:12px}</style>
  </head>
  <body>
    <nav><a href="public.html">Public site</a><a href="client.html">Client portal</a><a href="candidate.html">Candidate portal</a></nav>
    <h1>Demo: client</h1>
    <p>This page loads the <strong>built</strong> bundle (<code>dist/widget.js</code>) exactly as a real site would.</p>
    <!-- Portal: load with manual init, then pass the token issued after login -->
    <script src="../dist/widget.js" data-audience="client" data-region="UK" data-gateway-url="http://localhost:8787" data-manual-init="true"></script>
    <script>
      // In the real portal this token comes from your backend after the user logs in.
      window.VettingChat.init({ authToken: "dev-token-client" });
    </script>
  </body>
